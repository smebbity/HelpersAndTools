<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Fete of Ravenswood Bluff - ST Helper</title>
    <style>
        :root {
            --bg-color: #1a1a24;
            --card-bg: #252538;
            --text-color: #f0f0f5;
            --accent-color: #ffd700;
            --townsfolk: #2ecc71;
            --outsider: #3498db;
            --minion: #e74c3c;
            --demon: #9b59b6;
        }

        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #3d3d5c; padding-bottom: 10px; }
        h1 { margin: 0; color: var(--accent-color); font-size: 2rem; }
        .container { display: grid; grid-template-columns: 320px 1fr 300px; gap: 20px; max-width: 1400px; margin: 0 auto; align-items: start; }
        .panel { background-color: var(--card-bg); padding: 20px; border-radius: 10px; border: 1px solid #3d3d5c; margin-bottom: 20px; }
        .panel h2 { margin-top: 0; color: var(--accent-color); font-size: 1.3rem; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        select, input[type="text"] { width: 100%; padding: 10px; border-radius: 5px; background-color: #1a1a24; color: white; border: 1px solid #4d4d75; font-size: 1rem; box-sizing: border-box; }
        button.btn { background-color: var(--accent-color); color: #1a1a24; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; }
        .result-box { margin-top: 20px; padding: 15px; background-color: #1a1a24; border-radius: 5px; text-align: center; border-left: 5px solid var(--accent-color); }
        .result-box span { font-size: 2rem; font-weight: bold; display: block; color: var(--accent-color); }
        .player-row { display: flex; justify-content: space-between; align-items: center; background: #1a1a24; padding: 8px 12px; border-radius: 5px; margin-bottom: 8px; border: 1px solid #3d3d5c; font-size: 0.9rem; }
        .middle-column { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; align-content: start; }
        .role-card { background-color: var(--card-bg); border-radius: 8px; padding: 15px; border: 1px solid #3d3d5c; }
        .role-header { margin-bottom: 10px; }
        .role-name { font-weight: bold; font-size: 1.1rem; }
        .badge { font-size: 0.70rem; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; font-weight: bold; display: inline-block; margin-top: 5px; }
        .badge.townsfolk { background-color: var(--townsfolk); color: black; }
        .badge.outsider { background-color: var(--outsider); color: white; }
        .badge.minion { background-color: var(--minion); color: white; }
        .badge.demon { background-color: var(--demon); color: white; }
        .crops-box { background-color: #161622; border: 1px dashed #4d4d75; padding: 10px; border-radius: 5px; cursor: pointer; text-align: center; font-size: 0.9rem; }
        .crops-box:hover { background-color: #1e1e30; border-color: var(--accent-color); }
        .global-note-area { width: 100%; height: 400px; background: #161622; border: 1px solid #4d4d75; color: #d1d1e0; border-radius: 5px; padding: 12px; resize: vertical; font-size: 0.95rem; box-sizing: border-box; }
        .toast { position: fixed; bottom: 20px; right: 20px; background-color: #2ecc71; color: black; padding: 10px 20px; border-radius: 5px; font-weight: bold; display: none; z-index: 1000; }
    </style>
</head>
<body>

    <header><h1>The Fete of Ravenswood Bluff</h1></header>

    <div class="container">
        <div class="left-column">
            <div class="panel">
                <h2>🔮 Bounty Calculator</h2>
                <div class="form-group"><label>Targeted Player 1:</label><select id="target1" onchange="calculateScore()"></select></div>
                <div class="form-group"><label>Targeted Player 2:</label><select id="target2" onchange="calculateScore()"></select></div>
                <div class="result-box"><label>Report to Amnesiac:</label><span id="final-score">0</span></div>
            </div>
            <div class="panel">
                <h2>👥 Add Players</h2>
                <div class="form-group"><input type="text" id="player-name" placeholder="Name..."></div>
                <div class="form-group"><select id="player-role-select"></select></div>
                <button class="btn" onclick="addPlayer()">Add Player</button>
                <div style="margin-top: 15px;" id="player-list-container"></div>
            </div>
        </div>
        <div class="middle-column" id="middle-grid"></div>
        <div class="right-column">
            <div class="panel">
                <h2>📝 Game Notes</h2>
                <textarea class="global-note-area" id="global-notes" oninput="saveGlobalNote(this.value)" placeholder="General game notes..."></textarea>
            </div>
        </div>
    </div>

    <div class="toast" id="toast-msg">Copied to clipboard!</div>

    <script>
        let scriptData = [];
        let gamePlayers = [];
        
        window.onload = async function() {
            try {
                // Fetch both files in parallel
                const [rolesRes, scriptRes] = await Promise.all([
                    fetch('roles.json'),
                    fetch('script.json')
                ]);

                if (!rolesRes.ok) throw new Error("Could not load roles.json");
                if (!scriptRes.ok) throw new Error("Could not load script.json");

                const allRoles = await rolesRes.json();
                const scriptInfo = await scriptRes.json();

                // Extract active role IDs from script.json (ignoring meta-objects)
                const activeRoleIds = scriptInfo.filter(item => typeof item === 'string');

                // Filter roles.json to only include roles active in this script
                scriptData = allRoles.filter(role => activeRoleIds.includes(role.id));
                
                document.getElementById('global-notes').value = localStorage.getItem('game_notes') || '';
                populateRoleDropdown();
            } catch (err) {
                console.error("Error loading setup:", err);
                console.warn("Make sure both roles.json and script.json exist.");
            }
        };

        function saveGlobalNote(val) { localStorage.setItem('game_notes', val); }

        function populateRoleDropdown() {
            const roleSelect = document.getElementById("player-role-select");
            roleSelect.innerHTML = "";
            scriptData.forEach(role => {
                let opt = document.createElement("option");
                opt.value = role.id;
                opt.textContent = `${role.name} (${role.team})`;
                roleSelect.appendChild(opt);
            });
        }

        function addPlayer() {
            const name = document.getElementById("player-name").value.trim();
            const roleId = document.getElementById("player-role-select").value;
            if (!name || !roleId) return;
            
            const role = scriptData.find(r => r.id === roleId);
            gamePlayers.push({ uniqueId: Date.now(), name, role });
            document.getElementById("player-name").value = "";
            renderUI();
        }

        function deletePlayer(uniqueId) {
            gamePlayers = gamePlayers.filter(p => p.uniqueId !== uniqueId);
            renderUI();
        }

        function renderUI() {
            const playerList = document.getElementById("player-list-container");
            const midGrid = document.getElementById("middle-grid");
            playerList.innerHTML = "";
            midGrid.innerHTML = "";

            gamePlayers.forEach(p => {
                const row = document.createElement("div");
                row.className = "player-row";
                const iconPath = p.role.icon || 'default.webp';
                row.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <img src="img_botc/${iconPath}" 
                             onerror="this.src='https://placehold.co/30x30/252538/ffd700?text=?'" 
                             style="width: 30px; height: 30px; border-radius: 4px; object-fit: cover;">
                        <span>${p.name} — <b>${p.role.name}</b></span>
                    </div>
                    <button class="btn btn-danger" onclick="deletePlayer(${p.uniqueId})">X</button>
                `;
                playerList.appendChild(row);

                const card = document.createElement("div");
                card.className = "role-card";
                card.innerHTML = `
                    <div class="role-header">
                        <div class="role-name">${p.name} - ${p.role.name}</div>
                        <span class="badge ${p.role.team}">${p.role.team}</span>
                    </div>
                    <div class="crops-box" onclick="copyCrops('${(p.role.crops || []).join(", ")}')">${(p.role.crops || []).join(", ")}</div>
                `;
                midGrid.appendChild(card);
            });
            updateCalculators();
        }

        function updateCalculators() {
            const sels = [document.getElementById("target1"), document.getElementById("target2")];
            sels.forEach(sel => {
                sel.innerHTML = "";
                gamePlayers.forEach(p => {
                    let o = document.createElement("option");
                    o.value = p.role.points || 0;
                    o.textContent = `${p.name} (${p.role.name})`;
                    sel.appendChild(o);
                });
            });
            calculateScore();
        }

        function calculateScore() {
            const p1 = parseInt(document.getElementById("target1").value) || 0;
            const p2 = parseInt(document.getElementById("target2").value) || 0;
            document.getElementById("final-score").textContent = p1 + p2;
        }

        function copyCrops(text) {
            navigator.clipboard.writeText(text);
            const t = document.getElementById("toast-msg");
            t.style.display = "block";
            setTimeout(() => t.style.display = "none", 1800);
        }
    </script>
</body>
</html>
